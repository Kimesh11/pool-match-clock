<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pool Match Clock</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Animated setup background -->
    <div class="neon-background">
        <span class="neon-wave wave-blue"></span>
        <span class="neon-wave wave-purple"></span>
        <span class="neon-wave wave-green"></span>
        <span class="neon-wave wave-cyan"></span>
    </div>

    <main class="match-clock">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="match-header">
            <h1>POOL MATCH CLOCK</h1>
        </header>


        <!-- =====================================================
             MATCH SETUP
        ====================================================== -->

        <section class="match-setup" id="match-setup">

            <h2>Match Setup</h2>

            <div class="form-group">

                <label for="player-one-input">
                    Player 1
                </label>

                <input
                    type="text"
                    id="player-one-input"
                    placeholder="Enter player name"
                    maxlength="30"
                    required
                >

            </div>


            <div class="form-group">

                <label for="player-two-input">
                    Player 2
                </label>

                <input
                    type="text"
                    id="player-two-input"
                    placeholder="Enter player name"
                    maxlength="30"
                    required
                >

            </div>

            <div class="form-group">

                <label for="player-race-input">
                    Race to
                </label>

                <input
                    type="text"
                    id="player-race-input"
                    placeholder="Enter race"
                    maxlength="2"
                    required
                >

            </div>


            <div class="form-group">

                <label for="match-duration">
                    Match Duration
                </label>

                <select id="match-duration">

                    <option value="1800">
                        30 minutes
                    </option>

                    <option value="2700">
                        45 minutes
                    </option>

                    <option value="3600">
                        1 hour
                    </option>

                    <option value="5400">
                        1 hour 30 minutes
                    </option>

                    <option value="7200">
                        2 hours
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="shot-clock-duration">
                    Shot Clock
                </label>

                <select id="shot-clock-duration">

                    <option value="15">
                        15 seconds
                    </option>

                    <option value="30">
                        30 seconds
                    </option>

                    <option value="45">
                        45 seconds
                    </option>

                    <option value="60">
                        60 seconds
                    </option>

                </select>

            </div>


            <button
                id="setup-match-button"
                class="primary-button"
                type="button"
            >
                CONTINUE
            </button>

        </section>


        <!-- =====================================================
             MATCH SCREEN
        ====================================================== -->

        <section
            class="match-screen"
            id="match-screen"
        >

            <!-- =================================================
                 LAG SELECTION
            ================================================== -->

            <section
                class="lag-selection"
                id="lag-selection"
            >

                <h2>Lag Winner?</h2>

                <div class="lag-buttons">

                    <button
                        class="lag-button"
                        id="player-one-lag"
                        type="button"
                    >
                        PLAYER 1
                    </button>

                    <button
                        class="lag-button"
                        id="player-two-lag"
                        type="button"
                    >
                        PLAYER 2
                    </button>

                </div>


                <button
                    id="start-match-button"
                    class="primary-button"
                    type="button"
                    disabled
                >
                    START MATCH
                </button>


                <!-- Ball selection -->

                <div class="ball-set-selection">

                    <h3>SELECT BALL SET</h3>

                    <div class="ball-set-buttons">

                        <button
                            id="red-ball-button"
                            type="button"
                            disabled
                        >
                            🔴 RED
                        </button>

                        <button
                            id="yellow-ball-button"
                            type="button"
                            disabled
                        >
                            🟡 YELLOW
                        </button>

                    </div>

                </div>

            </section>


            <!-- =================================================
                 BROADCAST SCOREBOARD
            ================================================== -->

            <section class="broadcast-scoreboard">


                <!-- PLAYER ONE -->

                <div
                    class="broadcast-player player-one-broadcast"
                >

                    <div class="player-info">

                        <span
                            class="player-status"
                            id="player-one-indicator"
                        ></span>

                        <div>

                            <span class="player-label">
                                PLAYER 1
                            </span>

                            <h2 id="player-one-name">
                                Player 1
                            </h2>

                        </div>

                    </div>


                    <div class="player-ball-set">

                        <span
                            class="ball-indicator"
                            id="player-one-ball-indicator"
                        ></span>

                        <span id="player-one-ball-set">
                            Ball set not selected
                        </span>

                    </div>


                    <div
                        class="broadcast-score"
                        id="player-one-score"
                    >
                        0
                    </div>

                </div>


                <!-- =================================================
                     CENTER MATCH INFORMATION
                ================================================== -->

                <div class="broadcast-center">

                    <div class="race-to">
                        RACE TO
                    </div>

                    <div class="race-number" id="race-number">
                        5
                    </div>


                    <div class="center-divider"></div>


                    <div class="match-time-label">
                        MATCH
                    </div>

                    <div
                        class="broadcast-match-timer"
                        id="match-timer"
                    >
                        30:00
                    </div>


                    <div class="center-score">

                        <span id="center-score-one">
                            0
                        </span>

                        <span class="score-divider">
                            -
                        </span>

                        <span id="center-score-two">
                            0
                        </span>

                    </div>

                </div>


                <!-- PLAYER TWO -->

                <div
                    class="broadcast-player player-two-broadcast"
                >

                    <div class="player-info">

                        <div>

                            <span class="player-label">
                                PLAYER 2
                            </span>

                            <h2 id="player-two-name">
                                Player 2
                            </h2>

                        </div>

                        <span
                            class="player-status"
                            id="player-two-indicator"
                        ></span>

                    </div>


                    <div class="player-ball-set">

                        <span
                            class="ball-indicator"
                            id="player-two-ball-indicator"
                        ></span>

                        <span id="player-two-ball-set">
                            Ball set not selected
                        </span>

                    </div>


                    <div
                        class="broadcast-score"
                        id="player-two-score"
                    >
                        0
                    </div>

                </div>

            </section>


            <!-- =================================================
                 SHOT CLOCK
            ================================================== -->

            <section class="broadcast-shot-clock">

                <div class="shot-clock-header">

                    <span>
                        SHOT CLOCK
                    </span>

                    <span id="shot-clock-status">
                        READY
                    </span>

                </div>


                <div class="shot-clock-track">

                    <div
                        class="shot-clock-progress"
                        id="shot-clock-progress"
                    ></div>

                </div>


                <div
                    class="broadcast-shot-time"
                    id="shot-timer"
                >
                    30
                </div>

            </section>


            <!-- =================================================
                 OPERATOR CONTROLS
            ================================================== -->

            <section class="operator-controls">

                <div class="score-control">

                    <span id="operator-player-one">
                        PLAYER 1
                    </span>

                    <div class="score-buttons">

                        <button
                            id="player-one-minus"
                            type="button"
                            disabled
                        >
                            −
                        </button>

                        <button
                            id="player-one-plus"
                            type="button"
                            disabled
                        >
                            +
                        </button>

                    </div>

                </div>


                <div class="turn-controls">

                    <button
                        id="shot-button"
                        type="button"
                        disabled
                    >
                        SHOT TAKEN
                    </button>

                    <button
                        id="change-turn-button"
                        type="button"
                        disabled
                    >
                        END TURN
                    </button>

                </div>


                <div class="score-control">

                    <span id="operator-player-two">
                        PLAYER 2
                    </span>

                    <div class="score-buttons">

                        <button
                            id="player-two-minus"
                            type="button"
                            disabled
                        >
                            −
                        </button>

                        <button
                            id="player-two-plus"
                            type="button"
                            disabled
                        >
                            +
                        </button>

                    </div>

                </div>

            </section>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
